services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_events
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # SMTP_* come from server/.env (gitignored; copy server/.env.example). The values under
    # `environment` below take precedence, so the DB settings point at the local PostgreSQL service.
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/student_events
      DB_SSL: "false"
      JWT_SECRET: dev_only_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 1d
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
