services:
  mysql:
    image: mysql:8.0
    container_name: student-event-finder-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_events
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: student_events
      DB_USER: app_user
      DB_PASSWORD: app_password
    depends_on:
      mysql:
        condition: service_started
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mysql_data:
