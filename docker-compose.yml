services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_events
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
        - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Local SMTP catcher for demos: every receipt the API sends lands here instead of a real inbox.
  # Web UI: http://localhost:8025 — SMTP: mailpit:1025 inside the Compose network, localhost:1025 on the host.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # email.js always sends credentials, so accept any username/password without TLS.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # server/.env is optional local configuration. The values below always point the container
    # at the Compose services; override SMTP_* in the shell or a root .env to use a real provider.
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: student_events
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: dev_only_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 1d
      # Default to the bundled Mailpit catcher so the email demo works out of the box.
      # Override from the shell or a root .env to use Mailtrap: SMTP_HOST=... docker compose up -d
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-mailpit}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-mailpit}
      SMTP_FROM: ${SMTP_FROM:-no-reply@campushub.local}
    depends_on:
      mysql:
        condition: service_started
      mailpit:
        condition: service_started
    ports:
      - "5001:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mysql_data:
