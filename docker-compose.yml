services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_events
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
        - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # server/.env is optional local configuration. SMTP credentials should be supplied through
    # shell variables or a root .env file and are never committed.
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: student_events
      DB_USER: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: dev_only_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 1d
      SMTP_HOST: ${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@campushub.local}
    depends_on:
      mysql:
        condition: service_started
    ports:
      - "5001:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mysql_data:
